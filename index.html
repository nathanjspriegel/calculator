<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="calculator">
        <div class="display"></div>

        <div class="buttons">
            <div class="mainButtons">
                <button class="digitBtn" id="signBtn">+/-</button>
                <button class="digitBtn" id="decimalBtn">.</button>
                <button class="digitBtn">0</button>
                <button class="digitBtn">1</button>
                <button class="digitBtn">2</button>
                <button class="digitBtn">3</button>
                <button class="digitBtn">4</button>
                <button class="digitBtn">5</button>
                <button class="digitBtn">6</button>
                <button class="digitBtn">7</button>
                <button class="digitBtn">8</button>
                <button class="digitBtn">9</button>
                <button class="miscBtn" id="deleteBtn">C</button>
                <button class="miscBtn" id="clearBtn">AC</button>
                <button class="miscBtn" id="percentBtn">%</button>
            </div>
            <div class="operations">
                <button class="operatorBtn" id="addBtn">+</button>
                <button class="operatorBtn" id="subBtn">-</button>
                <button class="operatorBtn" id="multBtn">*</button>
                <button class="operatorBtn" id="divBtn">/</button>
                <button class="operatorBtn" id="equalBtn">=</button>
            </div>
        </div>
    </div>
</body>

</html>
